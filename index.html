<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zydeco &mdash; YouTube Channel Search</title>
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #181818;
    --border: #303030;
    --text: #f1f1f1;
    --muted: #aaaaaa;
    --accent: #ff0033;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 32px 16px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.8rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .search-bar {
    display: flex;
    gap: 8px;
    margin: 24px 0;
  }
  .search-bar input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    font-size: 1rem;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
  }
  .search-bar input[type="text"]:focus {
    border-color: var(--accent);
  }
  .search-bar button {
    padding: 12px 24px;
    font-size: 1rem;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .search-bar button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    text-align: center;
    color: var(--muted);
    min-height: 1.2em;
    margin-bottom: 12px;
  }
  #results {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .channel {
    display: flex;
    gap: 16px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease;
  }
  .channel:hover {
    border-color: var(--accent);
  }
  .channel img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #333;
  }
  .channel-info h3 {
    margin: 0 0 4px;
    font-size: 1rem;
  }
  .channel-info p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  details.api-key {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  details.api-key summary {
    cursor: pointer;
  }
  details.api-key input[type="password"] {
    width: 100%;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  details.api-key a {
    color: var(--accent);
  }
</style>
</head>
<body>
<header>
  <h1>Zydeco</h1>
  <p>Search YouTube for existing channel names</p>
</header>
<main>
  <form class="search-bar" id="search-form">
    <input type="text" id="query" placeholder="Search for a channel..." autocomplete="off" autofocus>
    <button type="submit" id="search-btn">Search</button>
  </form>

  <details class="api-key">
    <summary>YouTube API key</summary>
    <p>Zydeco needs a free <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">YouTube Data API v3 key</a> to search. It's stored only in your browser (localStorage).</p>
    <input type="password" id="api-key" placeholder="Paste your API key here">
  </details>

  <p id="status"></p>
  <div id="results"></div>
</main>

<script>
(function () {
  const form = document.getElementById('search-form');
  const queryInput = document.getElementById('query');
  const searchBtn = document.getElementById('search-btn');
  const apiKeyInput = document.getElementById('api-key');
  const apiKeyDetails = document.querySelector('details.api-key');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  const STORAGE_KEY = 'zydeco_youtube_api_key';

  try {
    const savedKey = localStorage.getItem(STORAGE_KEY);
    if (savedKey) {
      apiKeyInput.value = savedKey;
    } else {
      apiKeyDetails.open = true;
    }
  } catch (e) {
    apiKeyDetails.open = true;
  }

  apiKeyInput.addEventListener('change', function () {
    try {
      localStorage.setItem(STORAGE_KEY, apiKeyInput.value.trim());
    } catch (e) {}
  });

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function clearResults() {
    resultsEl.innerHTML = '';
  }

  function renderChannels(channels) {
    clearResults();
    if (channels.length === 0) {
      setStatus('No channels found.');
      return;
    }
    setStatus(channels.length + ' channel' + (channels.length === 1 ? '' : 's') + ' found');
    for (const channel of channels) {
      const a = document.createElement('a');
      a.className = 'channel';
      a.href = 'https://www.youtube.com/channel/' + channel.id;
      a.target = '_blank';
      a.rel = 'noopener';

      const img = document.createElement('img');
      img.src = channel.thumbnail;
      img.alt = channel.title;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'channel-info';

      const title = document.createElement('h3');
      title.textContent = channel.title;

      const desc = document.createElement('p');
      desc.textContent = channel.description;

      info.appendChild(title);
      info.appendChild(desc);
      a.appendChild(img);
      a.appendChild(info);
      resultsEl.appendChild(a);
    }
  }

  async function searchChannels(query, apiKey) {
    const url = new URL('https://www.googleapis.com/youtube/v3/search');
    url.searchParams.set('part', 'snippet');
    url.searchParams.set('type', 'channel');
    url.searchParams.set('maxResults', '15');
    url.searchParams.set('q', query);
    url.searchParams.set('key', apiKey);

    const response = await fetch(url.toString());
    const data = await response.json();

    if (!response.ok) {
      const message = (data && data.error && data.error.message) || 'Request failed';
      throw new Error(message);
    }

    return (data.items || []).map(function (item) {
      return {
        id: item.snippet.channelId,
        title: item.snippet.channelTitle || item.snippet.title,
        description: item.snippet.description || '',
        thumbnail: item.snippet.thumbnails && item.snippet.thumbnails.default
          ? item.snippet.thumbnails.default.url
          : ''
      };
    });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    const query = queryInput.value.trim();
    const apiKey = apiKeyInput.value.trim();

    if (!query) {
      setStatus('Type a channel name to search.');
      return;
    }
    if (!apiKey) {
      setStatus('Add your YouTube API key above to search.');
      apiKeyDetails.open = true;
      return;
    }

    searchBtn.disabled = true;
    setStatus('Searching...');
    clearResults();

    searchChannels(query, apiKey)
      .then(renderChannels)
      .catch(function (err) {
        setStatus('Error: ' + err.message);
      })
      .finally(function () {
        searchBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
